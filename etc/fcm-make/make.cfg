################################################################################
################################################################################
## This configuration file is used to build JULES from the source containing it
################################################################################
################################################################################


################################################################################
# Use environment variables to control the configuration via include files
################################################################################
# Variables defined initially so we can append to them later:
$extract_path_incl = bin src utils/drhook_dummy
$fpp_defs = SCMA BL_DIAG_HACK
$fflags =
$ldflags =
$external_mods =
$external_libs =
$inc_paths =
$lib_paths =
# Set by the compiler file when it can put automatic arrays on the stack
# (gfortran: -fstack-arrays); used for the plant hydraulics files below.
$fflags_stack_arrays =

# File that FCM should use to check MPI dependencies under JULES_MPI=nompi.
$nompi_trigger_file = jules/src/control/standalone/jules.F90

# Select a platform config; provided by the user.
$JULES_PLATFORM{?}        = custom

# Load the platform file
# The platform file includes other files, but can also control any platform
# specific overrides
include = $HERE/platform/$JULES_PLATFORM.cfg


################################################################################
# Configure the extract step
################################################################################
extract.ns = jules

# The location is the root JULES directory
extract.location[jules] = $HERE/../..

# We want to ignore UM, LFRic & standalone Rivers specific things
extract.path-excl[jules] = / src/control/um src/initialisation/um      \
                           src/science/snow/snow_intctl.F90            \
                           src/science/surface/flake_interface.F90     \
                           src/params/um                               \
                           src/science/river_routing/um                \
                           src/control/rivers-standalone               \
			               src/initialisation/rivers-standalone        \
			               src/io/rivers-standalone                    \
			               src/control/lfric


################################################################################
# Configure the preprocess step
################################################################################
preprocess.target{category} = src
preprocess.target{task} = install process
preprocess.prop{file-ext.h} = .inc


################################################################################
# Configure the build step
################################################################################
# Build options that are the same for every configuration
build.target = rose-run jules.exe

# Explicit dependencies that need to be defined
build.prop{ns-dep.o}[jules/src/control/standalone/jules.F90] = jules/utils


################################################################################
# Copy config variables into actual build properties
################################################################################
build.prop{fc}               = $compiler
extract.path-incl[jules]     = $extract_path_incl
preprocess.prop{fpp.defs}    = $fpp_defs
build.prop{fc.flags}         = $fflags $JULES_FFLAGS_EXTRA
build.prop{fc.flags-ld}      = $ldflags $JULES_LDFLAGS_EXTRA
build.prop{fc.defs}          = $fpp_defs
build.prop{no-dep.f.module}  = $external_mods
build.prop{fc.libs}          = $external_libs
build.prop{fc.include-paths} = $inc_paths
build.prop{fc.lib-paths}     = $lib_paths

# The plant hydraulics of the stomatal optimiser are called once or more
# per candidate opening, and gfortran puts their automatic arrays on the
# heap (a malloc and free on every call) unless -fstack-arrays is given.
# These files have only small automatic arrays (sized by the land points,
# by one sample per open point, or by the samples of one point), under
# 1 MB a routine for 20000 land points, so their stack use stays well
# within the default stack on a large grid.
$stack_path = jules/src/science/surface
build.prop{fc.flags}[$stack_path/xylem_hydraulics_jls_mod.f90]    = $fflags $JULES_FFLAGS_EXTRA $fflags_stack_arrays
build.prop{fc.flags}[$stack_path/plant_hydraulic_path_mod.f90]    = $fflags $JULES_FFLAGS_EXTRA $fflags_stack_arrays
build.prop{fc.flags}[$stack_path/xylem_impairment_mod.f90]        = $fflags $JULES_FFLAGS_EXTRA $fflags_stack_arrays
build.prop{fc.flags}[$stack_path/xylem_impairment_memory_mod.f90] = $fflags $JULES_FFLAGS_EXTRA $fflags_stack_arrays
